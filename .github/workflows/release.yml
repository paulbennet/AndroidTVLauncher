name: Release
# Push a tag like v1.0.2 to build a release APK signed with the project key and attach it to a GitHub release.
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64 (base64 of release.jks), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: gradle }
      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - run: ./gradlew --no-daemon assembleRelease testReleaseUnitTest
      - name: Check the APK is signed with the project key, not the debug key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          ! grep -q 'CN=Android Debug' certs.txt
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/build/outputs/apk/release/app-release.apk "web-launcher-${GITHUB_REF_NAME}.apk"
          sha256sum "web-launcher-${GITHUB_REF_NAME}.apk" > "web-launcher-${GITHUB_REF_NAME}.apk.sha256"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            "web-launcher-${GITHUB_REF_NAME}.apk" "web-launcher-${GITHUB_REF_NAME}.apk.sha256"
      - if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
